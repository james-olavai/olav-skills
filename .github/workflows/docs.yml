name: Validate Skills documentation

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'tools/build_docs.py'
      - 'tools/docs_hooks.py'
      - 'docs-url-map.json'
      - 'provenance/docs-legacy-*.json'
      - 'wrangler.docs.toml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: olav-docs-validation
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install documentation dependencies
        run: python -m pip install -r requirements-docs.txt
      - name: Build standalone manual and compatibility routes
        run: python -B tools/build_docs.py
      - name: Record release source
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path('site/docs-release.json').write_text(json.dumps({
              'repository': os.environ['GITHUB_REPOSITORY'],
              'commit': os.environ['GITHUB_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
          }) + '\n')
          PY
      - name: Preserve validated build
        uses: actions/upload-artifact@v4
        with:
          name: olav-docs-${{ github.sha }}
          path: site/
          retention-days: 30
          if-no-files-found: error
