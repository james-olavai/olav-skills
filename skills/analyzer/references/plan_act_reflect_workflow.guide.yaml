schema_version: 1
intent: plan_act_reflect_workflow
agent: netops
body: |
  For a complex evidence report, outline the question, authorized scope and the
  few observations needed to distinguish hypotheses. Simple lookups do not need
  a staged plan. Use supported bounded batch queries before relevant drilldown.
  After a result, check whether it supports the next inference, is truncated or
  missing a source. Correct a demonstrated argument issue once within the same
  scope; do not loop until a preferred answer appears or silently down-scope.
  Synthesize facts with device/value/source/time, unknowns and recommendations.
  Use the host's actual planning/file tools if available; no fixed todo, dispatch
  or export API is supplied. Missing evidence belongs in the final limitations,
  not a mandatory endless remediation cycle.
