schema_version: 1
intent: troubleshoot_layered_l1_to_l4_protocol_agnostic
agent: netops
keywords: [troubleshoot, diagnose, bgp, ospf, bfd, 故障, 不通]
body: |
  Use recorded evidence; no live CLI execution is supplied. Start at the
  lowest relevant layer and inspect actual source columns before bounded SQL.
  - BGP Idle: link and interface/address evidence first.
  - BGP Active: route to peer, then transport/ACL hypotheses.
  - BGP Connect: recorded TCP/port-179 evidence if captured; otherwise unknown.
  - BGP OpenSent: recorded neighbor/reset/config details if captured.
  - OSPF Init/ExStart: link, bidirectional visibility, MTU, area and timer evidence.
  - BFD Down: both endpoint link/address and recorded session evidence.
  If L1 is up, progress through L3 route and L4 transport to protocol policy.
  Do not turn absent views or an uncollected command into a healthy result.
  Use supported query_batch templates first, then scoped query_evidence or
  bounded analyzer execute_sql. An unsupported source stays a coverage gap.
  Distinguish observed facts from hypotheses and cite snapshot/time/source.
