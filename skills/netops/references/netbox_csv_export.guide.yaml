schema_version: 1
intent: netbox_csv_export
agent: netops
body: |
  A host may shape authorized returned inventory rows into a proposed CSV.
  No NetBox client, synchronization or general CSV exporter is supplied here.
  Possible field mappings: hostname→name, role→device_role, vendor→manufacturer,
  model→device_type, ip_address→primary_ip4, platform→platform, site→site.
  Verify the target NetBox version/import schema and existing object references
  separately; do not assume foreign keys or IP addresses will be auto-created.
  Unknown role/site stays unknown. Do not hardcode tenant or active status.
  Inventory is not historical snapshot membership; never CROSS JOIN an arbitrary
  latest snapshot to claim every row was collected then. Preserve collection
  provenance where actually known, and keep export time distinct.
  Use bounded analyzer queries; export_bounded exports only its preview and is
  not a full fleet export. Quote CSV using a real CSV writer if the host permits.
  Report scope, returned rows and truncation. Writing a CSV does not authorize
  NetBox import or any external mutation.
