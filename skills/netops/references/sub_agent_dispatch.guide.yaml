schema_version: 1
intent: skill_navigation
agent: netops
body: |
  The standalone package supplies skills, not a subagent dispatch API.
  Read the sibling SKILL.md relevant to the request:
  - analyzer: bounded state queries and change drafts.
  - reporter: evidence investigation and recorded-plan pre-check.
  - topology: recorded relationships and opt-in recipe writes.
  - importer: authorized offline bundle imports.
  - learner: explicit prepare/draft/validate/freeze parser workflow.
  - writer: diagrams and supplied-report presentation.
  Use olav-skills run <skill> <script> with stdin JSON or an actually available
  host tool. Host delegation, if present, needs its own authorization and schema.
  No collection, live probes, audit platform, lab or config simulator is shipped.
  An unavailable capability should be reported, not retried under invented names.
