schema_version: 1
intent: unreachable_device_stop
agent: netops
body: |
  This package reads recorded data and does not test live device reachability.
  A missing inventory device or absent command is unknown recorded coverage,
  not a live outage. Report the exact missing source/device and collection time.
  If supplied external probe evidence reports a transport/auth/timeout failure,
  keep that category and attempted time; do not convert it into a root cause.
  For an explicitly requested investigation, use relevant recorded evidence and
  report coverage limits. Do not automatically turn a lookup into an unbounded
  outage investigation or launch live probes that are unavailable here.
