schema_version: 1
intent: fault_analysis_workflow
agent: netops
body: |
  Start with the requested symptom, affected devices and recorded time window.
  Use bounded state templates; retrieve scoped command/config/log fragments only
  where they can test a hypothesis. Inspect actual schema before SQL fallback.
  Compare relevant layers and both endpoints if coverage permits. Missing source,
  unknown timestamp and query failure are gaps, not healthy or zero results.
  Rank supported findings, separate hypotheses and cite device/value/source/time.
  Graph impact is connectivity only, not traffic or config simulation. Live ping,
  collection and repair are outside this package. Stop when the answer is supported
  or a gap prevents further progress; do not retry unchanged failing calls.
  Return Markdown or save through an authorized host writer. No automatic agent
  router, memory recall, simulator or report exporter exists in this package.
