schema_version: 1
intent: topology_query
agent: netops
keywords: [topology, neighbor, bgp, ospf, cdp, lldp]
body: |
  Use olav-skills run topology query_topology with bgp/ospf/l2/all for
  typed recorded adjacency. Pin an authorized snapshot when supported.
  Inspect absent_layers before interpreting empty rows.
  For a needed SQL fallback, inspect actual source columns first and pass
  bounded SELECT SQL through olav-skills run analyzer execute_sql.
  Physical adjacency commonly comes from netops.topology_links and
  netops.v_l2_links_auto. BGP/OSPF use per-command v_show_*_auto sources.
  Do not assume historical v_bgp_neighbors_auto/v_ospf_neighbors_auto exist.
  Scope both endpoints for a one-hop closure, retain snapshot filters, and
  explicitly project fields with LIMIT. A neighbor observation is not proof
  of forwarding reachability or a live link. Topology is needed only when
  relevant to the user's question; no mandatory three-query sequence exists.
